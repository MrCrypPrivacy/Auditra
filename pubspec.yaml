name: auditra
description: Trade analytics dashboard for Hyperliquid wallets.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0
  flutter_svg: ^2.0.10
  window_manager: ^0.3.9
  web_socket_channel: ^2.4.0
  file_selector: ^1.0.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.svg
    - assets/app_icon.png
