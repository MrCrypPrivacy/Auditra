name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update -y
      - run: sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - run: flutter create --platforms=linux .
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../auditra-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: auditra-linux-x64
          path: auditra-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath auditra-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: auditra-windows-x64
          path: auditra-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=macos .
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../auditra-macos.zip Auditra.app
      - uses: actions/upload-artifact@v4
        with:
          name: auditra-macos
          path: auditra-macos.zip

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            auditra-linux-x64/auditra-linux-x64.tar.gz
            auditra-windows-x64/auditra-windows-x64.zip
            auditra-macos/auditra-macos.zip
