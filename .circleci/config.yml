version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  build-windows:
    executor:
      name: win/default
    steps:
      - checkout
      - run:
          name: Build Windows release
          shell: powershell.exe
          command: |
            git clone https://github.com/flutter/flutter.git -b stable C:\flutter
            $env:Path += ";C:\flutter\bin"
            flutter create --platforms=windows .
            flutter pub get
            flutter build windows --release
            Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath auditra-windows-x64.zip
      - store_artifacts:
          path: auditra-windows-x64.zip

  build-macos:
    macos:
      xcode: 15.4.0
    steps:
      - checkout
      - run:
          name: Build macOS release
          command: |
            git clone https://github.com/flutter/flutter.git -b stable ~/flutter
            export PATH="$PATH:$HOME/flutter/bin"
            flutter create --platforms=macos .
            flutter pub get
            flutter build macos --release
            cd build/macos/Build/Products/Release
            zip -r ~/project/auditra-macos.zip Auditra.app
      - store_artifacts:
          path: auditra-macos.zip

workflows:
  release:
    jobs:
      - build-windows:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
